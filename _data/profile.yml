about: >-
  Ph.D. in Computer Engineering and Assistant Professor at Waseda University
  (Japan), previously a postdoctoral researcher at the University of Cádiz
  (Spain). Accredited as Associate Professor by ANECA in 2025.

  My research focuses on sustainable computing, combining compiler
  optimization, artificial intelligence, and evolutionary computation to
  reduce the environmental impact of software systems, with applications in
  green software, intelligent transportation, and software security through
  code obfuscation. Author of 12 journal papers (9 Q1, 3 Q2) and 20+
  international conference papers, including CORE A/A/B venues. Research
  stays in Japan, Canada, and Belgium have led to ongoing international
  collaborations in sustainable AI and evolutionary computation.

research_interests:
  items:
    - title: "Green and Sustainable Computing"
      description: "Energy-aware software design, optimization, and environmental impact reduction across computing platforms."
    - title: "Compiler Optimization and Evolutionary Computation"
      description: "Automatic software tailoring, metaheuristics, and cooperative co-evolution for performance-energy trade-offs."
    - title: "Software Security and Code Obfuscation"
      description: "Optimization-driven source code protection and obfuscation methods for constrained and low-power environments."
    - title: "Intelligent Transportation Systems and Sustainable Mobility"
      description: "AI and predictive models for greener public transport operations, eco-driving, and emission-aware mobility planning."
